name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (EXE)
            os: windows-latest
            sys_deps: ""
            build_args: "--win"

          - name: Linux (AppImage, DEB, RPM)
            os: ubuntu-latest
            sys_deps: "libfuse2 rpm"
            build_args: "--linux AppImage deb rpm"

          # - name: macOS (DMG)
          #   os: macos-latest
          #   sys_deps: ""
          #   build_args: "--macos dmg zip"

    runs-on: ${{ matrix.os }}
    name: Build - ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install System Dependencies
        if: matrix.sys_deps != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.sys_deps }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Update package.json version
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"
          npm version "${TAG_NAME#v}" --no-git-tag-version

      - name: Install dependencies
        run: bun ci

      - name: Build
        run: bun run build ${{ matrix.build_args }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-build-${{ matrix.os }}
          path: |
            release/**/ransom0-ui-*
            release/**/*.blockmap
            release/**/latest*.yml
          retention-days: 1

  release:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Update Version and Changelog
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npm version $VERSION --no-git-tag-version
          npx conventional-changelog-cli -p angular -i CHANGELOG.md -s

          # for release note
          npx conventional-changelog-cli -p angular -r 1 > RELEASE_NOTE.md

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(release): ${{ github.ref_name }} [skip ci]"
          branch: main

      - name: Move Tag
        run: |
          git tag -f ${{ github.ref_name }}
          git push origin -f refs/tags/${{ github.ref_name }}

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-build-*
          merge-multiple: true
          path: dist-build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTE.md
          files: |
            dist-build/**/*

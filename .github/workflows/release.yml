name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (EXE)
            os: windows-latest
            sys_deps: ""
            build_args: "--win"

          - name: Linux (AppImage, DEB, RPM)
            os: ubuntu-latest
            sys_deps: "libfuse2 rpm"
            build_args: "--linux AppImage deb rpm"

          # - name: macOS (DMG)
          #   os: macos-latest
          #   sys_deps: ""

    runs-on: ${{ matrix.os }}
    name: Build - ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install System Dependencies
        if: matrix.sys_deps != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.sys_deps }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Update package.json version
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"
          npm version "${TAG_NAME#v}" --no-git-tag-version

      - name: Install dependencies
        run: bun ci

      - name: Build
        run: bun run build ${{ matrix.build_args }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-build-${{ matrix.os }}
          path: release/**/ransom0-ui-*
          retention-days: 1

  release:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-build-*
          merge-multiple: true
          path: dist-build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-build/**/*
